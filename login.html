<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Hệ Thống - LabMaster Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #eceae5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .login-card h2 { color: #007a78; margin-bottom: 25px; text-align: center; font-size: 1.6rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #6b6860; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #e0ddd6; border-radius: 6px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #008080; background-color: #e6f7f7; }
        .btn-login { width: 100%; background: #008080; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { background: #005a5a; }
        .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔒 LabMaster Pro OS</h2>
    <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản (Ví dụ: ktv1, tplab)">
    </div>
    <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
    </div>
    <button class="btn-login" onclick="handleLogin()">Đăng Nhập</button>
    <div id="error-box" class="error-msg"></div>
</div>

<script>
    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = 'none';

        if(!u || !p) {
            errorBox.innerText = "Vui lòng nhập đầy đủ tài khoản và mật khẩu!";
            errorBox.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('http://localhost:18080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            
            const result = await response.json();
            
            if (result.success) {
                // Lưu dữ liệu phiên đăng nhập vào trình duyệt
                localStorage.setItem('labmaster_user', JSON.stringify(result.user));
                // Chuyển hướng thẳng vào không gian làm việc chính
                window.location.href = 'project.html';
            } else {
                errorBox.innerText = result.message;
                errorBox.style.display = 'block';
            }
        } catch (error) {
            errorBox.innerText = "Lỗi kết nối tới Server. Hãy đảm bảo NodeJS đang chạy!";
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
