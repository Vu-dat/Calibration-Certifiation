<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2=family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">    
    <title>Quản lý Thiết bị chuẩn - LabMaster Pro</title>
    <style>
        /* --- Kế thừa nguyên vẹn bộ giao diện cốt lõi từ Project --- */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: var(--card-shadow); text-align: center; border-bottom: 4px solid #ddd; transition: var(--transition); }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { margin: 0; color: #777; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .stat-card p { font-size: 2rem; font-weight: 800; margin: 10px 0; color: var(--primary-teal); }
        
        /* Đồng bộ màu đường viền trạng thái thiết bị chuẩn */
        .stat-card.total { border-bottom-color: var(--primary-teal); }
        .stat-card.active-equipment { border-bottom-color: #2e7d32; } /* Xanh lá: Đang trong hạn chuẩn */
        .stat-card.expired-equipment { border-bottom-color: var(--danger); } /* Đỏ: Hết hạn hiệu chuẩn */

        .detail-section { background: white; padding: 30px; border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 30px; }
        h1.text-center-aligned { font-size: 1.8rem; color: var(--primary-teal); margin-bottom: 30px; position: relative; padding-bottom: 10px; }
        h1.text-center-aligned::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background: var(--primary-teal); }
        
        .equipment-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .equipment-table th { background: #f8f9fa; text-align: left; padding: 15px; border-bottom: 2px solid #eee; color: #666; font-weight: 600; }
        .equipment-table td { padding: 15px; border-bottom: 1px solid #f1f1f1; font-size: 0.95rem; }
        .equipment-table tr:hover { background-color: #fcfcfc; cursor: pointer; }
        
        /* Trạng thái hạn hiệu chuẩn đồng bộ tag mẫu */
        .status-tag { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .status-valid { background: #e8f5e9; color: #2e7d32; }
        .status-expired { background: #ffebee; color: var(--danger); }
        
        .btn-shiny { background: var(--primary-teal); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px rgba(0,128,128,0.2); transition: var(--transition); }
        .btn-shiny:hover { background: var(--primary-dark); box-shadow: 0 6px 12px rgba(0,128,128,0.3); }
        .btn-delete { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc; }
        .btn-delete:hover { color: var(--danger); }
        .btn-back { background: none; border: 1px solid #ddd; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 20px; color: #666; }
        .btn-back:hover { background: #eee; }
        
        /* Cấu trúc Form Grid nhập dữ liệu */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-weight: 600; color: #555; font-size: 0.9rem; }
        .form-grid input, .form-grid select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 0.95rem; }
        .form-grid input:focus, .form-grid select:focus { border-color: var(--primary-teal); outline: none; }
        .card-footer { grid-column: span 2; margin-top: 20px; text-align: center; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .detail-section { animation: fadeIn 0.4s ease-out forwards; }

        /* Khung tìm kiếm nâng cao */
        .search-container { display: flex; gap: 15px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .search-container input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; }
        .search-container select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 200px; }
        /* Ghi đè container để hiển thị full màn hình */
        .container { max-width: 100% !important; margin: 20px auto; padding: 0 30px; box-sizing: border-box; }
        .detail-section { max-width: 100% !important; width: 100%; box-sizing: border-box; }

        /* Tạo khung cuộn ngang cho bảng khi hiển thị trên màn hình nhỏ hơn */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .equipment-table { width: 100%; border-collapse: collapse; white-space: pre-line; } /* Giữ nguyên xuống dòng nội dung ô */
        .equipment-table th, .equipment-table td { padding: 12px 10px; font-size: 0.9rem; border-bottom: 1px solid #eee; text-align: left; }
        .equipment-table th { background: #f4f7f6; color: #444; font-weight: 700; sticky: top; }

    </style>
</head>
<body>

<header class="header">
    <div class="logo-wrapper" onclick="location.href='index.html'" style="cursor: pointer; display: flex; align-items: center;">
        <img src="./img/noimage.png" alt="LabMaster" class="main-logo">
    </div>
    <div class="nav-container">
        <nav class="navbar">
            <a href="index.html" id="nav-home">Home</a>
            <a href="project.html" id="nav-project">Project</a> 
            <a href="customer.html" id="nav-customer">Customer</a> 
            <a href="equipment.html" id="nav-equipment" class="active">Standard Equipment Database</a>
            <a href="databasequipment.html" id="nav-databasequipment">Database Equipment</a>
        </nav>
        <button class="btn-shiny" onclick="location.href='signin.html'">Sign In</button>
    </div>
</header>

<main class="container">
    <div class="dashboard-grid">
        <div class="stat-card total">
            <h4>Tổng thiết bị chuẩn</h4>
            <p id="stat-total">35</p>
        </div>
        <div class="stat-card active-equipment">
            <h4>Đạt chuẩn (Còn hạn)</h4>
            <p id="stat-active">33</p>
        </div>
        <div class="stat-card expired-equipment">
            <h4>Hết hạn hiệu chuẩn</h4>
            <p id="stat-expired">2</p>
        </div>
    </div>

    <section id="equipment-list-view" class="detail-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 class="text-center-aligned" style="margin: 0; padding: 0;">Standard Equipment</h1>
            <button class="btn-shiny" onclick="showAddEquipmentForm()">+ Add New Equipment</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Tìm kiếm theo mã, tên hoặc số Serial thiết bị..." onkeyup="filterEquipment()">
            <select id="filter-status" onchange="filterEquipment()">
                <option value="all">Tất cả trạng thái</option>
                <option value="valid">Còn hạn chuẩn</option>
                <option value="expired">Hết hạn chuẩn</option>
            </select>
        </div>
        
        <div class="table-responsive">
        <table class="equipment-table">
            <thead>
            <tr>
                <th>STT</th>
                <th>KEY</th>
                <th>CODE</th>
                <th>NAME</th>
                <th>NSX</th>
                <th>MODEL</th>
                <th>SERIAL</th>
                <th>GCN</th>
                <th>LIÊN KẾT CHUẨN</th>
                <th>NGÀY HIỆU CHUẨN</th>
                <th>Next cal date</th>
                <th>TRẠNG THÁI</th>
                <th style="text-align: center;">HÀNH ĐỘNG</th>
            </tr>
        </thead>
            <tbody id="equipment-table-body">
                <!-- Dữ liệu thiết bị chuẩn sẽ được chèn vào đây bằng JavaScript -->
            </tbody>
        </table>
        </div>
    </section>

    <section id="equipment-create-view" class="detail-section" style="display:none;">
        <h2 style="text-align: center; color: var(--primary-teal); margin-bottom: 25px;">Add New Standard Equipment</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Mã thiết bị (Equipment Code)*</label>
                <input type="text" id="new-eq-code" placeholder="Ví dụ: LAB-THERMO.05">
            </div>
            <div class="form-group">
                <label>Tên thiết bị chuẩn (Name)*</label>
                <input type="text" id="new-eq-name" placeholder="Ví dụ: Digital Thermometer">
            </div>
            <div class="form-group">
                <label>Nhà sản xuất (Manufacturer)</label>
                <input type="text" id="new-eq-nsx" placeholder="Ví dụ: EXTECH">
            </div>
            <div class="form-group">
                <label>Model</label>
                <input type="text" id="new-eq-model" placeholder="Ví dụ: Model XYZ">
            </div>
            <div class="form-group">
                <label>Serial Number</label>
                <input type="text" id="new-eq-serial" placeholder="Nhập Serial Number">
            </div>
            <div class="form-group">
                <label>Số Giấy chứng nhận (GCN)</label>
                <input type="text" id="new-eq-gcn" placeholder="Nhập số GCN gần nhất">
            </div>
            <div class="form-group">
                <label>Ngày hiệu chuẩn (Cal Date)</label>
                <input type="date" id="new-eq-caldate">
            </div>
            <div class="form-group">
                <label>Ngày hết hạn chu kỳ kế tiếp (Next Cal Date)</label>
                <input type="date" id="new-eq-nextdate">
            </div>
            <div class="card-footer">
                <button class="btn-back" style="margin-right: 10px;" onclick="showEquipmentList()">Cancel</button>
                <button class="btn-shiny" onclick="saveNewEquipment()">Save Equipment</button>
            </div>
        </div>
    </section>
</main>

    // Hàm tự động kết xuất danh sách toàn bộ các cột, không trộn lẫn dữ liệu
    function renderEquipmentTable() {
        const tableBody = document.getElementById('equipment-table-body');
        tableBody.innerHTML = '';
        const today = new Date();

        Object.values(equipmentData).forEach((eq) => {
            let statusClass = 'status-valid';
            let statusText = 'Còn hạn';
            
            if (eq.nextDate === '1900-12-31' || eq.calDate === '') {
                statusClass = 'status-expired';
                statusText = 'Chưa hiệu chuẩn';
            } else {
                const expireDate = new Date(eq.nextDate);
                if (expireDate < today) {
                    statusClass = 'status-expired';
                    statusText = 'Hết hạn / Cần HC';
                }
            }

            const row = document.createElement('tr');
            row.id = `row-${eq.stt}`;
            row.setAttribute('onclick', `viewEquipmentDetail('${eq.code || eq.name}')`);
            
            // Render chính xác từng cột độc lập theo file csv
            row.innerHTML = `
                <td>${eq.stt}</td>
                <td>${eq.key}</td>
                <td><strong>${eq.code || '--'}</strong></td>
                <td>${eq.name}</td>
                <td>${eq.nsx || '--'}</td>
                <td>${eq.model || '--'}</td>
                <td>${eq.serial || '--'}</td>
                <td>${eq.gcn || '--'}</td>
                <td>${eq.lienKet || '--'}</td>
                <td>${eq.calDate || '--'}</td>
                <td>${eq.nextDate}</td>
                <td><span class="status-tag ${statusClass}">${statusText}</span></td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="event.stopPropagation(); deleteEquipment('${eq.stt}')">🗑️</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        updateStats();
    }

    function showAddEquipmentForm() {
        document.getElementById('equipment-list-view').style.display = 'none';
        document.getElementById('equipment-create-view').style.display = 'block';
    }

    function showEquipmentList() {
        document.getElementById('equipment-create-view').style.display = 'none';
        document.getElementById('equipment-list-view').style.display = 'block';
    }

    function saveNewEquipment() {
        const code = document.getElementById('new-eq-code').value.trim();
        const name = document.getElementById('new-eq-name').value.trim();
        const nsx = document.getElementById('new-eq-nsx').value.trim();
        const model = document.getElementById('new-eq-model').value.trim();
        const serial = document.getElementById('new-eq-serial').value.trim();
        const calDate = document.getElementById('new-eq-caldate').value;
        const nextDate = document.getElementById('new-eq-nextdate').value || '1900-12-31';

        if (!name) {
            alert("Vui lòng điền tên thiết bị!");
            return;
        }

        const nextStt = String(Object.keys(equipmentData).length + 1);

        equipmentData[nextStt] = {
            stt: nextStt,
            key: 'manual_input',
            code: code,
            name: name,
            nsx: nsx,
            model: model,
            serial: serial,
            gcn: '',
            lienKet: '',
            calDate: calDate,
            nextDate: nextDate
        };
        
        renderEquipmentTable();
        alert("Thêm mới thiết bị chuẩn thành công!");
        showEquipmentList();
    }

    function deleteEquipment(stt) {
        if (confirm("Xác nhận gỡ bỏ thiết bị này khỏi danh sách hoạt động?")) {
            delete equipmentData[stt];
            const row = document.getElementById(`row-${stt}`);
            if (row) row.remove();
            updateStats();
        }
    }

    function updateStats() {
        const items = Object.values(equipmentData);
        const today = new Date();
        
        let total = items.length;
        let expired = items.filter(i => {
            if (i.nextDate === '1900-12-31' || i.calDate === '') return true;
            return new Date(i.nextDate) < today;
        }).length;
        let active = total - expired;

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-active').textContent = active;
        document.getElementById('stat-expired').textContent = expired;
    }

    function filterEquipment() {
        let input = document.getElementById('search-input').value.toUpperCase();
        let filterStatus = document.getElementById('filter-status').value;
        let table = document.getElementById('equipment-table-body');
        let tr = table.getElementsByTagName('tr');

        for (let i = 0; i < tr.length; i++) {
            let tdCode = tr[i].getElementsByTagName('td')[2]; // Cột CODE
            let tdName = tr[i].getElementsByTagName('td')[3]; // Cột NAME
            let tdStatus = tr[i].getElementsByTagName('td')[11]; // Cột Trạng thái mới
            
            if (tdCode || tdName) {
                let txtValueCode = tdCode.textContent || tdCode.innerText;
                let txtValueName = tdName.textContent || tdName.innerText;
                let isStatusMatch = true;

                if (filterStatus === 'valid' && !tdStatus.innerHTML.includes('status-valid')) isStatusMatch = false;
                if (filterStatus === 'expired' && !tdStatus.innerHTML.includes('status-expired')) isStatusMatch = false;

                if ((txtValueCode.toUpperCase().indexOf(input) > -1 || txtValueName.toUpperCase().indexOf(input) > -1) && isStatusMatch) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }

    function viewEquipmentDetail(identifier) {
        console.log("Chi tiết thiết bị chuẩn: " + identifier);
    }

    // Chạy tải bảng ngay khi load trang
    window.onload = function() {
        renderEquipmentTable();
    };
