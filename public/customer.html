<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Customer Management - LabMaster</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #edf2f7; }
        .section-header h2 { margin: 0; color: #2d3748; font-size: 1.5rem; }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
        }
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-group label {
            font-weight: 700;
            color: #4a5568;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .display-value {
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            border: 1px solid #edf2f7;
            color: #2d3748;
            min-height: 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="logo-wrapper" onclick="location.href='index.html'" style="cursor: pointer; display: flex; align-items: center;">
        <img src="./img/noimage.png" alt="LabMaster" class="main-logo">
    </div>
    
    <div class="nav-container">
        <nav class="navbar">
            <a href="index.html" id="nav-home">Home</a>
            <a href="project.html" id="nav-project">Project</a> 
            <a href="customer.html" id="nav-customer" class="active">Customer</a> 
            <a href="equipment.html" id="nav-equipment">Standard Equipment Database</a>
            <a href="databasequipment.html" id="nav-databasequipment">Database Equipment</a>
        </nav>
        <button class="btn-shiny" onclick="location.href='signin.html'">Sign In</button>
    </div>
</header>

<main class="container">
    <!-- Dashboard Thống kê Khách hàng -->
    <div class="dashboard-grid" style="margin-bottom: 40px;">
        <div class="stat-card total" style="border-bottom: 4px solid #008080;">
            <h4>Đối tác hệ thống</h4>
            <p id="stat-cust-total">4</p>
        </div>
        <div class="stat-card" style="border-bottom: 4px solid #3182ce;">
            <h4>VIP Partners</h4>
            <p id="stat-cust-vip">4</p>
        </div>
        <div class="stat-card" style="border-bottom: 4px solid #17a2b8;">
            <h4>Mới (30 ngày)</h4>
            <p>+2</p>
        </div>
    </div>

    <section id="customer-list-view" class="detail-section">
        <div class="section-header">
            <h2>Customer Database</h2>
            <button class="btn-shiny" onclick="showAddCustomerForm()">+ Thêm Khách hàng Mới</button>
        </div>

        <!-- Bộ lọc và Tìm kiếm -->
        <div class="search-container" style="margin-bottom: 20px; display: flex; gap: 10px;">
            <input type="text" id="cust-search-input" placeholder="Tìm tên khách hàng, công ty hoặc số điện thoại..." onkeyup="filterCustomers()" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
            <select id="filter-rank" onchange="filterCustomers()" style="padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                <option value="all">Tất cả hạng</option>
                <option value="VIP">Hạng VIP</option>
                <option value="Standard">Hạng Thường</option>
            </select>
        </div>

        <table class="detail-table">
            <thead>
                <tr>
                    <th width="80">ID</th><th>Người đại diện</th><th>Công ty / Tổ chức</th><th>Liên hệ</th><th>Phân hạng</th><th style="text-align: center;">Thao tác</th>
                </tr>
            </thead>
            <tbody id="customer-table-body">
            </tbody>
        </table>
    </section>

    <section id="customer-item-detail" class="detail-section" style="display: none;">
        <div class="section-header">
            <h2 id="display-name-header">Hồ sơ khách hàng</h2>
            <button class="btn-shiny" style="background: #4a5568;" onclick="showCustomerList()"><b>🔙 Trở lại</b></button>
        </div>

        <div class="profile-header">
            <div style="width: 80px; height: 80px; border-radius: 12px; background: var(--primary-teal); display: flex; align-items: center; justify-content: center; font-size: 30px; color: white;">🏢</div>
            <div>
                <h2 id="display-name-title" style="margin: 0; color: #2d3748;">---</h2>
                <span id="display-id-tag" class="status-tag status-finished">ID: #---</span>
            </div>
        </div>

        <div class="admin-grid">
            <div class="info-group">
                <label>🏢 Tên công ty / Tổ chức</label>
                <div id="display-company" class="display-value"></div>
                <input type="text" id="edit-company" class="form-input" style="display:none;">
            </div>
            <div class="info-group">
                <label>🧾 Mã số thuế</label>
                <div id="display-tax" class="display-value"></div>
                <input type="text" id="edit-tax" class="form-input" style="display:none;">
            </div>
            <div class="info-group">
                <label>👤 Người đại diện liên hệ</label>
                <div id="display-contact" class="display-value"></div>
                <input type="text" id="edit-contact" class="form-input" style="display:none;">
            </div>
            <div class="info-group">
                <label>📧 Địa chỉ Email</label>
                <div id="display-email" class="display-value"></div>
                <input type="email" id="edit-email" class="form-input" style="display:none;">
            </div>
            <div class="info-group">
                <label>📍 Địa chỉ xuất hóa đơn</label>
                <div id="display-billing-address" class="display-value"></div>
                <input type="text" id="edit-billing-address" class="form-input" style="display:none;">
            </div>
            <div class="info-group">
                <label>🏅 Phân hạng</label>
                <div class="display-value"><span style="color: #b45309; font-weight: bold;">★ VIP PARTNER</span></div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <label style="font-weight: 700; color: #4a5568; font-size: 0.85rem; text-transform: uppercase;">📝 Ghi chú nội bộ</label>
            <div id="display-note" class="display-value" style="margin-top: 10px; min-height: 80px;"></div>
            <textarea id="edit-note" class="form-input" style="display:none; width: 100%; height: 80px; margin-top: 10px;"></textarea>
        </div>

        <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
            <button id="btn-edit" class="btn-shiny" onclick="enableEdit()" style="background: #2d3748;">✏️ Chỉnh sửa hồ sơ</button>
        </div>

        <div id="edit-actions" style="display: none; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                <button class="btn-save" onclick="saveCustomerChanges()">Save & Overwrite</button>
            </div>
    </section>

    <div id="customer-add-view" style="display: none;">
    <div class="create-project-form">
        <h1 style="text-align: center;">Add New Customer</h1>
        <div class="form-grid">
            <input type="text" id="add-cust-name" placeholder="Full Name">
            <input type="text" id="add-cust-company" placeholder="Company Name">
            <input type="text" id="add-cust-phone" placeholder="Phone Number">
            <textarea id="add-cust-note" placeholder="Customer notes..."></textarea>
            
            <div class="card-footer" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-cancel" onclick="showCustomerList()">Cancel</button>
                <button class="btn-save" onclick="saveNewCustomer()">Save Customer</button>
            </div>
        </div>
    </div>
</div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem('labmaster_user');
    if (!user) {
        alert("Hết phiên làm việc hoặc bạn chưa đăng nhập. Vui lòng đăng nhập lại!");
        window.location.href = 'login.html'; // Hoặc đường dẫn '/'
    }
});
    // Tự động nhận diện nếu chạy ở máy local thì gọi localhost, nếu chạy trên mạng thì dùng đường dẫn tương đối
    const API_BASE_URL = window.location.hostname === 'localhost' 
    ? 'http://localhost:18080' 
    : window.location.origin;
    let customerData = {
        '1': { id: '1', name: 'Nguyen Van A', company: 'Samsung Vina', phone: '0123456789', tax: '0101010101', contact: 'Mr. An', email: 'an.nv@samsung.com', billingAddress: 'KCN Yên Phong, Bắc Ninh', note: 'Đã hiệu chuẩn 5 thiết bị...' },
        '2': { id: '2', name: 'Tran Thi B', company: 'LG Electronics', phone: '0987654321', tax: '0202020202', contact: 'Ms. Bình', email: 'binh.tt@lg.com', billingAddress: 'KCN Tràng Duệ, Hải Phòng', note: 'Đã hiệu chuẩn 3 thiết bị...' },
        '3': { id: '3', name: 'Le Van C', company: 'Apple Vietnam', phone: '0912345678', tax: '0303030303', contact: 'Mr. Cường', email: 'cuong.lv@apple.com', billingAddress: 'KCN Phú Mỹ, Bà Rịa - Vũng Tàu', note: 'Đã hiệu chuẩn 2 thiết bị...' },
        '4': { id: '4', name: 'Pham Thi D', company: 'Sony Vietnam', phone: '0901234567', tax: '0404040404', contact: 'Ms. Dung', email: 'dung.pt@sony.com', billingAddress: 'KCN Sóng Thần, Bà Rịa - Vũng Tàu', note: 'Đã hiệu chuẩn 1 thiết bị...' }
    };

    let currentId = null;

    function renderCustomerTable(data = customerData) {
        const tableBody = document.getElementById('customer-table-body');
        tableBody.innerHTML = '';
        Object.values(data).forEach(cust => {
            const row = document.createElement('tr');
            row.id = `customer-row-${cust.id}`;
            row.innerHTML = `
                <td onclick="viewCustomer('${cust.id}')"><strong>#${cust.id}</strong></td>
                <td class="name-cell" onclick="viewCustomer('${cust.id}')">
                    <div style="font-weight: 600;">${cust.name}</div>
                    <div style="font-size: 0.75rem; color: #718096;">${cust.contact || 'Chưa cập nhật'}</div>
                </td>
                <td class="company-cell" onclick="viewCustomer('${cust.id}')">
                    <div style="color: var(--primary-teal); font-weight: 500;">${cust.company}</div>
                    <div style="font-size: 0.75rem; color: #a0aec0;">MST: ${cust.tax || '---'}</div>
                </td>
                <td>
                    <div>📞 ${cust.phone}</div>
                    <div style="font-size: 0.8rem;">📧 ${cust.email || '---'}</div>
                </td>
                <td><span class="status-tag" style="background: #fef3c7; color: #b45309; font-size: 0.7rem;">★ VIP PARTNER</span></td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteCustomer('${cust.id}')" title="Xóa hồ sơ">🗑️</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
        document.getElementById('stat-cust-total').textContent = Object.keys(customerData).length;
        document.getElementById('stat-cust-vip').textContent = Object.keys(customerData).length;
    }

    function filterCustomers() {
        const query = document.getElementById('cust-search-input').value.toLowerCase();
        const filtered = Object.values(customerData).filter(c => 
            c.name.toLowerCase().includes(query) || 
            c.company.toLowerCase().includes(query) || 
            c.phone.includes(query)
        );
        const filteredObj = {};
        filtered.forEach(c => filteredObj[c.id] = c);
        renderCustomerTable(filteredObj);
    }

    function viewCustomer(id) {
        currentId = id;
        const customer = customerData[id];
        if (customer) {
            document.getElementById('customer-list-view').style.display = 'none';
            document.getElementById('customer-item-detail').style.display = 'block';
            document.getElementById('display-name-title').textContent = customer.name;
            document.getElementById('display-id-tag').innerText = "ID: #" + customer.id;
            document.getElementById('display-company').textContent = customer.company || "N/A";
            document.getElementById('display-tax').textContent = customer.tax || "N/A";
            document.getElementById('display-contact').textContent = customer.contact || "N/A";
            document.getElementById('display-email').textContent = customer.email || "N/A";
            document.getElementById('display-billing-address').textContent = customer.billingAddress || "N/A";
            document.getElementById('display-note').textContent = customer.note || "N/A";
            toggleUI(false);
        }
    }

    // Quay lại danh sách
    function showCustomerList() {
        document.getElementById('customer-list-view').style.display = 'block';
        document.getElementById('customer-item-detail').style.display = 'none';
    }

    // Kích hoạt chế độ Edit
    function enableEdit() {
    const pass = prompt("Nhập mật khẩu (123) để sửa:");
    if (pass === "123") {
        const customer = customerData[currentId];
        if (document.getElementById('edit-company')) document.getElementById('edit-company').value = customer.company || "";
        if (document.getElementById('edit-tax')) document.getElementById('edit-tax').value = customer.tax || "";
        if (document.getElementById('edit-contact')) document.getElementById('edit-contact').value = customer.contact || "";
        if (document.getElementById('edit-email')) document.getElementById('edit-email').value = customer.email || "";
        if (document.getElementById('edit-billing-address')) document.getElementById('edit-billing-address').value = customer.billingAddress || "";
        if (document.getElementById('edit-note')) document.getElementById('edit-note').value = customer.note || "";
        toggleUI(true);
    } else {
        alert("Sai mật khẩu!");
    }
}

    // Hủy chỉnh sửa
    function cancelEdit() {
        toggleUI(false);
    }

    // Lưu thay đổi (Overwrite)
    function saveCustomerChanges() {
    const newCompany = document.getElementById('edit-company').value;
    const newTax = document.getElementById('edit-tax').value;
    const newContact = document.getElementById('edit-contact').value;
    const newEmail = document.getElementById('edit-email').value;
    const newAddress = document.getElementById('edit-billing-address').value;
    const newNote = document.getElementById('edit-note').value;
    customerData[currentId].company = newCompany;
    customerData[currentId].tax = newTax;
    customerData[currentId].contact = newContact;
    customerData[currentId].email = newEmail;
    customerData[currentId].billingAddress = newAddress;
    customerData[currentId].note = newNote;
    document.getElementById('display-company').textContent = newCompany;
    document.getElementById('display-tax').textContent = newTax;
    document.getElementById('display-contact').textContent = newContact;
    document.getElementById('display-email').textContent = newEmail;
    document.getElementById('display-billing-address').textContent = newAddress;
    document.getElementById('display-note').textContent = newNote;
    renderCustomerTable();
    toggleUI(false);
    alert("Đã cập nhật thông tin khách hàng thành công!");
}

    // Hàm bổ trợ ẩn/hiện các thành phần Edit
    function toggleUI(isEdit) {
    // Danh sách các trường cần chuyển đổi
    const fields = ['company', 'tax', 'contact', 'email', 'billing-address', 'note'];   
    fields.forEach(field => {
        const displayElem = document.getElementById(`display-${field}`);
        const editElem = document.getElementById(`edit-${field}`);
        if (editElem) editElem.style.display = isEdit ? 'block' : 'none';
    });
    const editActions = document.getElementById('edit-actions');
    const btnEdit = document.getElementById('btn-edit');
    
    if (editActions) editActions.style.display = isEdit ? 'flex' : 'none';
    if (btnEdit) btnEdit.style.display = isEdit ? 'none' : 'block';
}

    function deleteCustomer(id) {
        if(confirm("Xóa khách hàng này?")) {
            document.getElementById(`customer-row-${id}`).remove();
            delete customerData[id];
            renderCustomerTable();
        }
    }

    // Hàm hiển thị Form thêm mới
function showAddCustomerForm() {
    document.getElementById('customer-list-view').style.display = 'none';
    document.getElementById('customer-add-view').style.display = 'block';
    document.getElementById('customer-item-detail').style.display = 'none';
}

// Hàm lưu khách hàng mới
function saveNewCustomer() {
    const name = document.getElementById('add-cust-name').value;
    const company = document.getElementById('add-cust-company').value;
    const phone = document.getElementById('add-cust-phone').value;
    const note = document.getElementById('add-cust-note').value;

    if (!name || !company) {
        alert("Vui lòng nhập tên và công ty!");
        return;
    }

    const newId = Date.now().toString().slice(-3); 

    // Lưu vào biến dữ liệu
    customerData[newId] = {
        id: newId,
        name: name,
        company: company,
        phone: phone,
        note: note
    };

    // Thêm vào bảng HTML
    const tableBody = document.getElementById('customer-table-body');
    const newRow = document.createElement('tr');
    newRow.id = `customer-row-${newId}`;
    newRow.innerHTML = `
        <td onclick="viewCustomer('${newId}')">${newId}</td>
        <td class="name-cell" onclick="viewCustomer('${newId}')">${name}</td>
        <td class="company-cell" onclick="viewCustomer('${newId}')">${company}</td>
        <td>${phone}</td>
        <td class="note-cell">${note}</td>
        <td><button class="btn-delete" onclick="deleteCustomer('${newId}')">🗑️</button></td>
    `;
    tableBody.appendChild(newRow);

    alert("Thêm khách hàng thành công!");
    // Reset form
    document.getElementById('add-cust-name').value = '';
    document.getElementById('add-cust-company').value = '';
    document.getElementById('add-cust-phone').value = '';
    document.getElementById('add-cust-note').value = '';
    
    showCustomerList();
}
// Lưu trữ dữ liệu đo lường riêng cho từng thiết bị
let calibrationData = {
    'EQ001': { measures: [], average: 0, conclusion: '-', color: '' }
};
function editEq(id) {
    currentId = id;
    showView('edit-view');
    
    // Đổ tên và hãng sản xuất
    document.getElementById('edit-title').innerText = "Detail: " + document.getElementById('n-' + id).innerText;
    document.getElementById('in-manu').value = document.getElementById('m-' + id).innerText;

    // Lấy dữ liệu đã lưu của thiết bị này
    const data = calibrationData[id] || { measures: [], average: 0, conclusion: '-', color: '' };
    const inputs = document.querySelectorAll('.measure-input');
    
    // Đổ 10 giá trị Measured vào ô input
    inputs.forEach((input, index) => {
        input.value = data.measures[index] || "";
    });

    // Hiển thị Average và Conclusion đã lưu
    const avgBox = document.getElementById('res-average');
    const conBox = document.getElementById('res-conclusion');
    
    avgBox.innerText = data.average;
    conBox.innerText = data.conclusion;
    conBox.style.color = data.color;
}


    // Tự động render danh sách ngay khi load trang để có thể cuộn thủ công
    renderCustomerTable();
</script>

</body>
