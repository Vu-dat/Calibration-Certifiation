<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Customer Management - LabMaster</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<header class="header">
    <div class="logo-wrapper" onclick="location.href='index.html'" style="cursor: pointer;">
        <img src="./img/noimage.png" alt="LabMaster" class="main-logo">
    </div>
    <nav class="navbar">
       <nav class="navbar">
    <a href="index.html" >Home</a>
    <a href="project.html">Project</a> 
    <a href="customer.html" class="active">Customer</a> 
    <a href="equipment.html">Standard Equipment</a>
</nav>
    </nav>
</header>

<main class="container">
    <section id="customer-list-view" class="detail-section">
        <h1 class="text-center-aligned">Customer Information</h1>
        <table class="customer-table">
            <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Company</th><th>Phone</th><th>Note</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="customer-table-body">
                <tr id="customer-row-1">
                    <td onclick="viewCustomer('1')">1</td>
                    <td class="name-cell" onclick="viewCustomer('1')">Nguyen Van A</td>
                    <td class="company-cell" onclick="viewCustomer('1')">Samsung Vina</td>
                    <td>0123456789</td>
                    <td class="note-cell">Đã hiệu chuẩn 5 thiết bị...</td>
                    <td><button class="btn-delete" onclick="deleteCustomer('1')">🗑️</button></td>
                </tr>
            </tbody>
        </table>
        <div class="button-wrapper" style="text-align: center; margin-top: 20px;">
            <button class="btn-shiny" onclick="showAddCustomerForm()">+ Add New Customer</button>
        </div>
    </section>

    <section id="customer-item-detail" class="detail-section" style="display: none;">
        <div class="detail-actions-bar" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <button class="btn-back" onclick="showCustomerList()">← Back to List</button>
            
        </div>

        <div class="info-card">
            <h2 id="detail-title" class="text-center-aligned" style="color: var(--primary-teal); margin-bottom: 20px;"></h2>
            
            <p><strong>ID:</strong> <span id="display-id"></span></p>
            
            <p><strong>Company:</strong> 
                <span id="display-company"></span>
                <input type="text" id="edit-company" class="form-input" style="display:none;">
            </p>
            
            <p><strong>Note:</strong> <br>
                <span id="display-note"></span>
                <textarea id="edit-note" class="form-input" style="display:none; width: 100%; height: 100px;"></textarea>
            </p>
            <button id="btn-edit" class="btn-primary" onclick="enableEdit()" style="display: block;">Edit</button>
            <div id="edit-actions" class="card-footer" style="display: none; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                <button class="btn-save" onclick="saveCustomerChanges()">Save & Overwrite</button>
            </div>
        </div>
    </section>
    <div id="customer-add-view" style="display: none;">
    <div class="create-project-form">
        <h1 style="text-align: center;">Add New Customer</h1>
        <div class="form-grid">
            <input type="text" id="add-cust-name" placeholder="Full Name">
            <input type="text" id="add-cust-company" placeholder="Company Name">
            <input type="text" id="add-cust-phone" placeholder="Phone Number">
            <textarea id="add-cust-note" placeholder="Customer notes..."></textarea>
            
            <div class="card-footer" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-cancel" onclick="showCustomerList()">Cancel</button>
                <button class="btn-save" onclick="saveNewCustomer()">Save Customer</button>
            </div>
        </div>
    </div>
</div>
</main>

<script>
    // Dữ liệu mẫu
    let customerData = { 
        '1': { id: '1', name: 'Nguyen Van A', company: 'Samsung Vina', phone: '0123456789', note: 'Đã hiệu chuẩn 5 thiết bị...' } 
    };
    let currentId = null;

    // Xem chi tiết
    function viewCustomer(id) {
        currentId = id;
        const customer = customerData[id];
        if (customer) {
            document.getElementById('customer-list-view').style.display = 'none';
            document.getElementById('customer-item-detail').style.display = 'block';

            document.getElementById('detail-title').textContent = customer.name;
            document.getElementById('display-id').textContent = customer.id;
            document.getElementById('display-company').textContent = customer.company;
            document.getElementById('display-note').textContent = customer.note;

            cancelEdit(); // Reset về trạng thái xem
        }
    }

    // Quay lại danh sách
    function showCustomerList() {
        document.getElementById('customer-list-view').style.display = 'block';
        document.getElementById('customer-item-detail').style.display = 'none';
    }

    // Kích hoạt chế độ Edit
    function enableEdit() {
        const pass = prompt("Nhập mật khẩu (123) để sửa:");
        if (pass === "123") {
            // Đổ dữ liệu vào ô input
            document.getElementById('edit-company').value = customerData[currentId].company;
            document.getElementById('edit-note').value = customerData[currentId].note;
            toggleUI(true);
        } else {
            alert("Sai mật khẩu!");
        }
    }

    // Hủy chỉnh sửa
    function cancelEdit() {
        toggleUI(false);
    }

    // Lưu thay đổi (Overwrite)
    function saveCustomerChanges() {
        const newCompany = document.getElementById('edit-company').value;
        const newNote = document.getElementById('edit-note').value;

        // 1. Lưu vào biến dữ liệu
        customerData[currentId].company = newCompany;
        customerData[currentId].note = newNote;

        // 2. Cập nhật bảng danh sách
        const row = document.getElementById(`customer-row-${currentId}`);
        if (row) {
            row.querySelector('.company-cell').textContent = newCompany;
            row.querySelector('.note-cell').textContent = newNote;
        }

        // 3. Cập nhật giao diện chi tiết
        document.getElementById('display-company').textContent = newCompany;
        document.getElementById('display-note').textContent = newNote;

        toggleUI(false);
        alert("Đã cập nhật thông tin khách hàng!");
    }

    // Hàm bổ trợ ẩn/hiện các thành phần Edit
    function toggleUI(isEdit) {
        document.getElementById('display-company').style.display = isEdit ? 'none' : 'inline';
        document.getElementById('display-note').style.display = isEdit ? 'none' : 'inline';
        
        document.getElementById('edit-company').style.display = isEdit ? 'block' : 'none';
        document.getElementById('edit-note').style.display = isEdit ? 'block' : 'none';
        document.getElementById('edit-actions').style.display = isEdit ? 'flex' : 'none';
        document.getElementById('btn-edit').style.display = isEdit ? 'none' : 'block';
    }

    function deleteCustomer(id) {
        if(confirm("Xóa khách hàng này?")) {
            document.getElementById(`customer-row-${id}`).remove();
            delete customerData[id];
        }
    }

    // Hàm hiển thị Form thêm mới
function showAddCustomerForm() {
    document.getElementById('customer-list-view').style.display = 'none';
    document.getElementById('customer-add-view').style.display = 'block';
    document.getElementById('customer-item-detail').style.display = 'none';
}

// Hàm lưu khách hàng mới
function saveNewCustomer() {
    const name = document.getElementById('add-cust-name').value;
    const company = document.getElementById('add-cust-company').value;
    const phone = document.getElementById('add-cust-phone').value;
    const note = document.getElementById('add-cust-note').value;

    if (!name || !company) {
        alert("Vui lòng nhập tên và công ty!");
        return;
    }

    const newId = Date.now().toString().slice(-3); 

    // Lưu vào biến dữ liệu
    customerData[newId] = {
        id: newId,
        name: name,
        company: company,
        phone: phone,
        note: note
    };

    // Thêm vào bảng HTML
    const tableBody = document.getElementById('customer-table-body');
    const newRow = document.createElement('tr');
    newRow.id = `customer-row-${newId}`;
    newRow.innerHTML = `
        <td onclick="viewCustomer('${newId}')">${newId}</td>
        <td class="name-cell" onclick="viewCustomer('${newId}')">${name}</td>
        <td class="company-cell" onclick="viewCustomer('${newId}')">${company}</td>
        <td>${phone}</td>
        <td class="note-cell">${note}</td>
        <td><button class="btn-delete" onclick="deleteCustomer('${newId}')">🗑️</button></td>
    `;
    tableBody.appendChild(newRow);

    alert("Thêm khách hàng thành công!");
    // Reset form
    document.getElementById('add-cust-name').value = '';
    document.getElementById('add-cust-company').value = '';
    document.getElementById('add-cust-phone').value = '';
    document.getElementById('add-cust-note').value = '';
    
    showCustomerList();
}


</script>
</body>
</html>
